name: Validate report explorer
on:
  pull_request:
  push:
    branches: [main, interactive-report-explorer]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and validate
        run: |
          npm ci
          python -m pip install -r requirements.txt
          npm run analyze
          git diff --exit-code -- public/data public/case-material-notice.txt tests/fixtures
          npm test
          npm run build
